# Flutter 3.47 模板默认 -Xmx8G/4G metaspace——面向高配桌面机。
# 在内存受限环境（本沙箱 5.8GB / 手机 8-16GB）会导致 gradle/kotlin daemon
# 被 cgroup OOM killer 击杀，症状是 "Gradle build daemon disappeared unexpectedly"。
# 服务器实测值（2026-09-16）：5.8GB 总内存下 daemon 1.5g + kotlin daemon 1g 稳定。
# 手机端按设备 RAM 动态下调（见 dev-handbook/02-构建流程.md init.gradle 注入）。
#
# ⚠️ 2026-09-19 修订（alpha.62 出包时踩到）：上面的 1.5g 是**按 5.8GB 小机器**
# 定的。实测在 **release** 构建（AOT + R8 + dex 全量）后期不够用，daemon
# 会消失——症状与 cgroup OOM 完全一样，但成因不同。判据：
# `free -m` 有大量 available 却仍报 daemon disappeared → 是 JVM 自身堆耗尽。
#
# ⚠️ 2026-09-20 二次修订（alpha.62 出包再踩）：上一版写成 6g + kotlin 3g，
# 是**按 123GB 大机器**定的；本沙箱 cgroup 上限只有 **8GiB**
# （`cat /sys/fs/cgroup/memory.max`），6g + 3g + 元空间/线程栈/原生缓冲
# 必然超顶 → cgroup OOM killer 击杀 daemon，同样报
# "Gradle build daemon disappeared unexpectedly"。
#
# **定值公式**：`gradle 堆 + kotlin 堆 + 1.5g(元空间/线程/原生) < cgroup 上限`。
# 本沙箱 8GiB → 4g + 2g + 1.5g ≈ 7.5g，留 0.5g 余量（实测通过）。
# 换机器先看 cgroup 上限，别照抄数字；**手机端更不要照抄**，
# 仍按设备 RAM 用 init.gradle 动态下调（见 dev-handbook/02-构建流程.md）。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
