# Flutter 3.47 模板默认 -Xmx8G/4G metaspace——面向高配桌面机。
# 在内存受限环境（本沙箱 5.8GB / 手机 8-16GB）会导致 gradle/kotlin daemon
# 被 cgroup OOM killer 击杀，症状是 "Gradle build daemon disappeared unexpectedly"。
# 服务器实测值（2026-09-16）：5.8GB 总内存下 daemon 1.5g + kotlin daemon 1g 稳定。
# 手机端按设备 RAM 动态下调（见 dev-handbook/02-构建流程.md init.gradle 注入）。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
