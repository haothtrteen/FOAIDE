# Flutter 3.47 模板默认 -Xmx8G/4G metaspace——面向高配桌面机。
# 在内存受限环境（本沙箱 5.8GB / 手机 8-16GB）会导致 gradle/kotlin daemon
# 被 cgroup OOM killer 击杀，症状是 "Gradle build daemon disappeared unexpectedly"。
# 服务器实测值（2026-09-16）：5.8GB 总内存下 daemon 1.5g + kotlin daemon 1g 稳定。
# 手机端按设备 RAM 动态下调（见 dev-handbook/02-构建流程.md init.gradle 注入）。
#
# ⚠️ 2026-09-19 修订（alpha.62 出包时踩到）：上面的 1.5g 是**按 5.8GB 小机器**
# 定的。实测在 **release** 构建（AOT + R8 + dex 全量）后期不够用，daemon
# 会消失——症状与 cgroup OOM 完全一样，但成因不同。判据：
# `free -m` 有大量 available 却仍报 daemon disappeared → 是 JVM 自身堆耗尽。
#
# ⚠️ 2026-09-20 二次修订（alpha.62 出包再踩）：上一版写成 6g + kotlin 3g，
# 是**按 123GB 大机器**定的；本沙箱 cgroup 上限只有 **8GiB**
# （`cat /sys/fs/cgroup/memory.max`），6g + 3g + 元空间/线程栈/原生缓冲
# 必然超顶 → cgroup OOM killer 击杀 daemon，同样报
# "Gradle build daemon disappeared unexpectedly"。
#
# ⚠️ 2026-09-20 三次修订（alpha.63 出包**实测 OOM 现场**，这份是最终结论）：
# 前一版 4g + 2g + 1.5g ≈ 7.5g「留 0.5g 余量」**仍然不够**，构建跑到 49 分钟
# （2950s，dex/R8 阶段）后 daemon 被杀，报同一个
# "Gradle build daemon disappeared unexpectedly"。
#
# **现场证据**（不再靠估算）：
#   cat /sys/fs/cgroup/memory.events → oom_kill 1
#   cat /sys/fs/cgroup/memory.peak   → 8590462976  （memory.max = 8589934592）
# 峰值**超出上限仅 528KB**——精确贴顶，是 cgroup OOM killer 击杀。
#
# **被忽略的真凶：daemon 不止一个。** release 构建同时存活三个 JVM：
#   Gradle daemon (JDK17, -Xmx4g)     RSS ~976MB
#   Kotlin daemon #1 (JDK20, -Xmx2g)  RSS ~1186MB   编译器 2.2.21
#   Kotlin daemon #2 (JDK20, -Xmx2g)  RSS ~1115MB   编译器 2.4.0
# 三个 -Xmx 相加 = 8g，**已经等于整个 cgroup 上限**，再加元空间/线程栈/
# 原生缓冲/文件页缓存必然溢出。JVM 是**预留式**的：-Xmx 决定它敢涨到哪，
# 不取决于当时 RSS 多少——所以「free -m 还有 available」不能作为安全判据。
#
# **定值公式（修订版）**：
#   `Σ(所有 daemon 堆) + 1.5g(元空间/线程/原生) + 0.5g(页缓存余量) < cgroup 上限`
# 注意是 **Σ 所有 daemon**，不是只算 gradle 那一个。本沙箱 8GiB：
#   2.5g(gradle) + 1.5g(kotlin) + 1.5g + 0.5g = 6g，留 2g 真实余量。
# 另需 `org.gradle.workers.max=2` 限制并发 worker 数，避免多个
# worker 进程同时膨胀；并 `--no-daemon` 语义上等价于每任务新建 JVM，
# 反而不利，故保留 daemon 复用。
#
# 换机器先看 cgroup 上限，别照抄数字；**手机端更不要照抄**，
# 仍按设备 RAM 用 init.gradle 动态下调（见 dev-handbook/02-构建流程.md）。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 沙箱网络：境外仓库被 DNS 黑洞化（198.18.0.x），必须设超时否则无限挂起
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000

# Bug 608（alpha.79 定论）：Gradle VFS watching（inotify）在沙箱 overlay fs 上
# 会干扰输出快照的文件读取（mergeReleaseJniLibFolders 快照 libapp.so 报
# EIO → Failed to create MD5 hash）。关掉后一次过。细节见 handbook Bug 608。
org.gradle.vfs.watch=false
