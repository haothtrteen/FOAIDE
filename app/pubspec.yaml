name: flutter_on_android
description: A Flutter IDE that runs natively on Android devices, with local Flutter SDK and on-device APK building.
publish_to: 'none'
version: 0.1.0-alpha.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 文件与路径
  path_provider: ^2.1.2
  path: ^1.9.0

  # 持久化
  shared_preferences: ^2.2.2

  # 压缩解压（rootfs tarball）
  archive: ^3.4.10

  # HTTP 下载（后续工具链下载用）
  dio: ^5.4.0

  # 工具类
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/tools/
    - assets/rootfs/
