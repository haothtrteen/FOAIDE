name: flutter_on_android
description: A Flutter IDE that runs natively on Android devices, with local Flutter SDK and on-device APK building.
publish_to: 'none'
version: 0.1.0-alpha.9+9

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（EnvState → UI 单向数据流）
  provider: ^6.1.1

  # Step 2 编辑器：语法高亮 + 代码输入（CodeField 基于 TextField，IME 友好）
  code_text_field: ^1.1.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 二进制资产不进 git，先运行 tools/fetch_assets.sh（见 SETUP_ANDROID.md）
  assets:
    - assets/tools/
    - assets/rootfs/
