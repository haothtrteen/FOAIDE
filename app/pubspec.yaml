name: flutter_on_android
description: A Flutter IDE that runs natively on Android devices, with local Flutter SDK and on-device APK building.
publish_to: 'none'
version: 0.1.0-alpha.47+47

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（EnvState → UI 单向数据流）
  provider: ^6.1.1

  # Step 2 编辑器：语法高亮 + 代码输入（CodeField 基于 TextField，IME 友好）
  # 使用本地 vendored 版本（修复 Bug 216 安全键盘：移除 enableSuggestions: false）
  code_text_field:
    path: third_party/code_text_field
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  dart_style: ^3.1.13
  url_launcher: ^6.3.2
  crypto: ^3.0.7

  # Bug 430 可交互终端：完整 VT100/xterm 仿真（vim/top 全屏渲染、
  # 256 色、光标定位、鼠标事件）。不用它就得自己写 ANSI 解释器，
  # 而全屏程序的转义序列覆盖度是自研方案最容易翻车的地方。
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 二进制资产不进 git，先运行 tools/fetch_assets.sh（见 SETUP_ANDROID.md）
  assets:
    - assets/tools/
    - assets/rootfs/
    - assets/ca/
